/* ==========================================================================
   GRÁFICA VISUALTECH — Estilos
   Paleta y tipografías definidas como variables para editarlas en un lugar.
   ========================================================================== */
:root {
  --orange: #D07F29;
  --orange-d: #B86D1F;
  --ink: #1D1D1B;
  --ink-2: #2A2A28;
  --gray: #808080;
  --gray-l: #B3B3B3;
  --paper: #FCFBFA;
  --paper-2: #F3F1ED;
  --line: rgba(29, 29, 27, .12);
  --line-light: rgba(252, 251, 250, .14);

  --f-display: "Bebas Neue", "Arial Narrow", Impact, sans-serif;
  --f-body: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;

  --radius: 22px;
  --radius-sm: 14px;
  --gutter: 16px;
  --header-h: 68px;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
@media (min-width: 768px) { :root { --gutter: 32px; --header-h: 80px; } }
@media (min-width: 1200px) { :root { --gutter: 64px; } }
@media (min-width: 1600px) { :root { --gutter: 80px; --header-h: 88px; } }

*, *::before, *::after { box-sizing: border-box; }
/* overflow-x: clip en html y body: nada que se salga por el costado (líneas de títulos, cintas) puede
   ensanchar la página en el celular (antes la página quedaba más ancha que la pantalla). */
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--header-h) + 12px); -webkit-text-size-adjust: 100%; overflow-x: clip; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.6;
  -webkit-font-smoothing: antialiased; overflow-x: hidden; overflow-x: clip;
}
body.menu-open, body.modal-open { overflow: hidden; }
img, video, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; border-radius: 4px; }
::selection { background: var(--orange); color: var(--paper); }
.skip { position: absolute; left: -999px; top: 8px; background: var(--ink); color: var(--paper); padding: 10px 16px; z-index: 200; border-radius: 8px; }
.skip:focus { left: 8px; }

/* Ancho amplio para aprovechar pantallas grandes (1920 px y más) */
.container { width: 100%; max-width: 1840px; margin: 0 auto; padding: 0 var(--gutter); }
.muted { color: var(--gray); }

/* ---------- Tipografía ---------- */
.h-display { font-family: var(--f-display); font-weight: 400; text-transform: uppercase; line-height: .9; letter-spacing: .005em; margin: 0; }
.h-hero { font-size: clamp(3.4rem, 11.5vw, 9.6rem); }
.h-lg { font-size: clamp(2.6rem, 5.6vw, 4.8rem); }
.h-md { font-size: clamp(2rem, 4vw, 3rem); line-height: .95; }
/* Subtítulos (listas, columnas, tarjetas): Inter liviana, en minúsculas.
   Los títulos de sección siguen en Bebas Neue: así se distinguen por el trazo y no solo por el tamaño. */
:root { --fs-sub: clamp(1.2rem, 1.45vw, 1.6rem); }
.h-sm, .svc-name, .tl-title, .exh-steps h3 {
  font-family: var(--f-body); font-weight: 300; text-transform: none; letter-spacing: -.015em; line-height: 1.2;
}
.h-sm { font-size: var(--fs-sub); }
.lead { font-size: clamp(1.05rem, 1.4vw, 1.2rem); color: #5c5c59; max-width: 46ch; margin: 0; }

.dia { display: inline-block; width: 8px; height: 8px; background: var(--orange); transform: rotate(45deg); flex: none; }
.eyebrow {
  display: flex; align-items: center; gap: 12px; margin: 0 0 22px; white-space: nowrap;
  /* La línea larga del título no debe ensanchar columnas ni grillas */
  contain: inline-size; min-width: 0;
  font-size: .78rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--gray);
}
/* Línea del título: aparece corta y, cuando la línea de recorrido llega, se estira hasta el borde de la pantalla */
.eyebrow::after { content: ""; flex: none; height: 1px; width: 56px; background: var(--orange); opacity: .7; transform-origin: left; transform: scaleX(0); transition: transform .8s var(--ease) .15s, width 1.6s var(--ease) .5s; }
/* --line-w lo calcula main.js para que la línea termine justo en el borde de la pantalla (sin desbordar) */
.eyebrow.is-in::after { transform: scaleX(1); width: var(--line-w, 56px); }
/* Versión espejada (título a la derecha): la línea va hacia la izquierda */
.svc-mirror .eyebrow::after { order: -1; transform-origin: right; }
/* Rombo compartido con la línea de recorrido: contorno al principio, se rellena con un "pop" al llegar la línea */
.route-on #app-main .eyebrow[data-node] > .dia { display: none; }
.eyebrow .dia { background: transparent; box-shadow: inset 0 0 0 1.2px var(--orange); transition: background .3s; }
.eyebrow.is-in .dia { background: var(--orange); animation: diaPop .6s var(--ease); }
@keyframes diaPop { 0% { transform: rotate(45deg) scale(.4); } 55% { transform: rotate(45deg) scale(1.6); } 100% { transform: rotate(45deg) scale(1); } }
.eyebrow.is-light { color: rgba(252, 251, 250, .7); }

/* ---------- Botones ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 52px; padding: 0 24px; border-radius: 999px;
  font-weight: 600; font-size: .95rem; letter-spacing: .01em; white-space: nowrap;
  transition: background .25s, color .25s, border-color .25s, transform .25s var(--ease);
  border: 1.5px solid transparent;
}
.btn svg { width: 20px; height: 20px; flex: none; }
.btn .arrow { width: 18px; transition: transform .3s var(--ease); }
.btn:hover .arrow { transform: translateX(4px); }
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--orange); color: #fff; }
.btn-primary:hover { background: var(--orange-d); }
.btn-secondary { border-color: var(--ink); color: var(--ink); }
.btn-secondary:hover { background: var(--ink); color: var(--paper); }
.btn-dark { background: var(--ink); color: var(--paper); }
.btn-dark:hover { background: #000; }
.btn-ghost-light { border-color: rgba(252, 251, 250, .5); color: var(--paper); }
.btn-ghost-light:hover { background: var(--paper); color: var(--ink); border-color: var(--paper); }
.btn-sm { min-height: 44px; padding: 0 18px; font-size: .88rem; }
.btn-block { width: 100%; }
.btn-row { display: flex; flex-wrap: wrap; gap: 12px; }
.btn.is-loading { opacity: .7; pointer-events: none; }
.btn.is-loading span::after { content: "…"; }
.link-btn { font-size: inherit; text-align: left; }
.link-btn:hover { color: var(--orange); }

/* ---------- Logo ---------- */
.logo { display: inline-flex; align-items: center; }
.logo img { height: 44px; width: auto; }
@media (min-width: 768px) { .logo img { height: 50px; } }
.isotipo { height: auto; }

/* ---------- Header ---------- */
.site-header {
  position: fixed; inset: 0 0 auto; z-index: 90; height: var(--header-h);
  transition: background .3s, box-shadow .3s, backdrop-filter .3s;
}
.site-header.is-scrolled, body:not([data-page="home"]) .site-header {
  background: rgba(252, 251, 250, .88); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px);
  box-shadow: 0 1px 0 var(--line);
}
.header-inner { height: 100%; display: flex; align-items: center; gap: 24px; }
.header-inner > .logo { margin-right: auto; }
body.menu-open .site-header { background: var(--paper) !important; box-shadow: 0 1px 0 var(--line) !important; }

.main-nav { display: none; }
.main-nav ul { list-style: none; display: flex; align-items: center; gap: clamp(4px, 1.8vw, 36px); margin: 0; padding: 0; }
.nav-secondary .nav-link { color: #5c5c59; }
.nav-push { margin-left: auto; }
.btn-pill { border-radius: 999px; padding: 0 22px; }
@media (min-width: 1080px) {
  .header-inner > .logo { margin-right: clamp(16px, 4vw, 72px); }
  .main-nav { flex: 1; }
}
.nav-link {
  display: inline-flex; align-items: center; gap: 6px; padding: 10px 14px; border-radius: 999px;
  font-size: .93rem; font-weight: 500; transition: background .2s, color .2s;
}
.nav-link svg { width: 12px; transition: transform .25s; }
.nav-link:hover { background: rgba(128, 128, 128, .14); }
.has-dropdown { position: relative; }
.has-dropdown.is-open .nav-link svg { transform: rotate(180deg); }
.dropdown {
  position: absolute; top: calc(100% + 10px); left: 50%; width: 560px; padding: 14px;
  background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: 0 30px 60px -20px rgba(29, 29, 27, .25);
  opacity: 0; visibility: hidden; transform: translate(-50%, 8px); transition: opacity .25s, transform .25s var(--ease), visibility .25s;
}
.dropdown::before { content: ""; position: absolute; inset: -12px 0 auto; height: 12px; }
.has-dropdown.is-open .dropdown { opacity: 1; visibility: visible; transform: translate(-50%, 0); }
.dropdown-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
.dropdown-grid a { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; font-size: .93rem; font-weight: 500; color: var(--ink); transition: background .2s; }
.dropdown-grid a .dia { width: 6px; height: 6px; background: var(--gray-l); transition: background .2s; }
.dropdown-grid a:hover { background: var(--paper-2); }
.dropdown-grid a:hover .dia { background: var(--orange); }
.dropdown-all { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding: 14px; border-top: 1px solid var(--line); font-size: .88rem; font-weight: 600; color: var(--orange); }
.dropdown-all .arrow { width: 18px; }
.header-cta { display: none; }

.burger { width: 44px; height: 44px; display: grid; place-content: center; gap: 7px; }
.burger span { display: block; width: 26px; height: 2px; background: var(--ink); transition: transform .35s var(--ease); }
.menu-open .burger span:first-child { transform: translateY(4.5px) rotate(45deg); }
.menu-open .burger span:last-child { transform: translateY(-4.5px) rotate(-45deg); }

@media (min-width: 1080px) {
  .main-nav, .header-cta { display: block; }
  .burger { display: none; }
}

/* ---------- Menú mobile ---------- */
.mobile-menu {
  position: fixed; inset: 0; z-index: 80; background: var(--paper); color: var(--ink);
  padding-top: calc(var(--header-h) + 16px); overflow-y: auto;
  clip-path: inset(0 0 100% 0); transition: clip-path .55s var(--ease); visibility: hidden;
}
.menu-open .mobile-menu { clip-path: inset(0 0 0 0); visibility: visible; }
.mobile-menu nav { display: flex; flex-direction: column; padding-bottom: 40px; }
.m-link {
  display: flex; align-items: center; justify-content: space-between; width: 100%;
  font-family: var(--f-display); font-size: clamp(2.6rem, 11vw, 4rem); line-height: 1.05; text-align: left;
  padding: 8px 0; border-bottom: 1px solid var(--line);
}
.m-toggle .dia { transition: transform .3s; }
.m-toggle[aria-expanded="true"] .dia { transform: rotate(135deg); }
.m-sub { display: flex; flex-direction: column; overflow: hidden; max-height: 0; transition: max-height .45s var(--ease); }
.m-sub.is-open { max-height: 600px; }
.m-sub a { padding: 10px 0 10px 4px; color: #5c5c59; font-size: 1.05rem; }
.m-sub a:first-child { padding-top: 16px; }
.m-sub a:last-child { padding-bottom: 18px; }
.m-cta { display: flex; flex-direction: column; gap: 12px; margin-top: 32px; }
.m-meta { color: var(--gray); font-size: .9rem; margin-top: 28px; }

/* ---------- Secciones ---------- */
.section { padding: clamp(56px, 7vw, 96px) 0 0; position: relative; }
main > .section:last-of-type { padding-bottom: clamp(56px, 7vw, 96px); }
.section-tint { background: var(--paper-2); padding-bottom: clamp(56px, 7vw, 96px); margin-top: clamp(56px, 7vw, 96px); }
.section-head { margin-bottom: clamp(28px, 3.5vw, 44px); }
.section-head .eyebrow { margin-bottom: 16px; }
.section-head-row { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px 48px; }
.section-head-row .h-lg { max-width: 22ch; }

/* ---------- Reveal ---------- */
[data-reveal] { opacity: 0; transform: translateY(28px); transition: opacity .9s var(--ease) var(--d, 0s), transform .9s var(--ease) var(--d, 0s); }
[data-reveal].is-in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { [data-reveal] { opacity: 1; transform: none; transition: none; } }

/* ---------- Línea de recorrido ---------- */
#app-main { position: relative; }
/* La línea va por detrás: las secciones quedan encima, y donde hay imágenes o fondos la tapan */
.route { position: absolute; top: 0; left: 0; z-index: 0; pointer-events: none; overflow: visible; display: none; }
#app-main > section { position: relative; z-index: 1; }
@media (min-width: 1200px) { .route { display: block; } }
.route.is-off { display: none; }
.route-path { fill: none; stroke: var(--orange); stroke-width: 1; opacity: .75; transition: stroke-dashoffset .15s linear; }
.route-node { fill: var(--paper); stroke: var(--orange); stroke-width: 1.2; transition: fill .3s; transform-box: fill-box; transform-origin: center; transform: rotate(45deg); }
.route-node.on { fill: var(--orange); animation: diaPop .6s var(--ease); }
.route-tick { stroke: var(--orange); stroke-width: 1; opacity: 0; transition: opacity .6s; }
.route-tick.on { opacity: .5; }

/* ---------- Placeholders de imagen ---------- */
.ph {
  position: relative; width: 100%; height: 100%; display: grid; place-items: center; overflow: hidden;
  background:
    repeating-linear-gradient(135deg, transparent 0 22px, rgba(255, 255, 255, .035) 22px 23px),
    radial-gradient(120% 90% at 85% 10%, #3a3a37 0%, var(--ink) 60%);
  color: rgba(252, 251, 250, .6);
}
.ph.tone-gray { background: repeating-linear-gradient(135deg, transparent 0 22px, rgba(255, 255, 255, .06) 22px 23px), radial-gradient(120% 90% at 85% 10%, #a5a5a3 0%, #6e6e6c 70%); }
.ph.tone-warm { background: repeating-linear-gradient(135deg, transparent 0 22px, rgba(29, 29, 27, .04) 22px 23px), radial-gradient(120% 90% at 85% 10%, #fff 0%, #e8e3dc 75%); color: var(--gray); }
.ph-mark .isotipo { width: 34px; opacity: .9; }
.ph.tone-warm .ph-mark .isotipo { opacity: 1; }
.ph-label { position: absolute; left: 18px; bottom: 14px; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; }

/* ---------- 1. HERO ---------- */
.hero { position: relative; overflow: hidden; }
.hero-stage { position: relative; min-height: 100svh; display: flex; flex-direction: column; }
.hero-inner { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; justify-content: center; padding-top: calc(var(--header-h) + 40px); padding-bottom: clamp(40px, 6vh, 80px); }
.hero .h-hero { font-size: clamp(3.2rem, min(7.6vw, 13vh), 11rem); line-height: .88; max-width: 20ch; margin: 0 0 clamp(40px, 7vh, 96px); }
.hl { color: var(--orange); }
/* "+17 años construyendo relaciones con empresas como" → cinta de marcas */
.hero-bottom { display: grid; gap: 18px; }
.hero-dato { display: grid; gap: 4px; margin: 0; }
.hero-dato strong { font-family: var(--f-display); font-weight: 400; font-size: clamp(2.6rem, 3.4vw, 4rem); line-height: .9; }
.hero-dato span { font-size: .88rem; color: #5c5c59; max-width: 22ch; line-height: 1.4; }
/* La cinta sale del contenedor y llega hasta el borde derecho de la pantalla */
.hero-clients { min-width: 0; margin-right: calc(-1 * var(--gutter) - max(0px, (100vw - 1840px) / 2)); }
.hero-clients .marquee { border: 0; -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%); mask-image: linear-gradient(90deg, transparent, #000 6%); }
.hero-clients .marquee li { height: 72px; width: clamp(140px, 12vw, 200px); padding: 0 22px; border-right: 1px solid var(--line); }
.hero-clients .marquee img { max-height: 40px; }
.hero-clients .logo-ph b { font-size: 1.4rem; }
.hero-clients .logo-ph svg { width: 22px; height: 22px; }
@media (min-width: 900px) {
  .hero-bottom { grid-template-columns: auto minmax(0, 1fr); gap: clamp(32px, 4vw, 72px); align-items: center; }
}
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
@media (max-width: 899px) { .hero .h-hero { font-size: min(14vw, 8vh); } }

/* ---------- 2. SLIDER ---------- */
.works .eyebrow { margin-bottom: 24px; }
.works-grid { position: relative; display: grid; gap: 20px; }
.works-stage { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: var(--paper-2); margin: 0 var(--gutter); touch-action: pan-y; }
.work-slide {
  position: absolute; top: 0; bottom: 0; left: 0; width: 100%; z-index: 0; opacity: 0;
  clip-path: inset(0 0 0 100%); transition: clip-path 1.1s var(--ease), transform 1.1s var(--ease), opacity .5s, filter 1.1s;
}
.work-slide > * { width: 100%; height: 100%; object-fit: cover; }
.work-slide.is-active { opacity: 1; z-index: 2; clip-path: inset(0 0 0 0); }
/* La anterior queda debajo mientras la nueva entra barriendo desde la derecha */
.work-slide.is-prev { z-index: 1; opacity: 1; clip-path: inset(0 0 0 0); }
.works-side { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
/* Cinta de rubros: sin fondo, en el mismo lenguaje que las etiquetas de sección (mayúsculas espaciadas + rombo naranja) */
.works-ribbon { height: 44px; display: flex; align-items: center; overflow: hidden; color: var(--gray); -webkit-mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); }
.wr-track { display: flex; align-items: center; gap: 28px; padding-left: 28px; white-space: nowrap; font-weight: 600; font-size: .75rem; letter-spacing: .16em; text-transform: uppercase; animation: ribbon 40s linear infinite; }
.wr-track .dia { width: 6px; height: 6px; }
@keyframes ribbon { to { transform: translateX(-50%); } }
.works-ribbon:hover .wr-track { animation-play-state: paused; }
.works-caption, .works-ctrl { padding: 0 var(--gutter); }
.wc-title { margin: 0; font-family: var(--f-body); font-size: 1.05rem; font-weight: 600; letter-spacing: -.01em; }
.wc-type { margin: 4px 0 0; color: var(--gray); font-size: .9rem; }
.works-ctrl { display: flex; align-items: center; gap: 10px; }
.ctrl-btn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; transition: background .2s; }
.ctrl-btn svg { width: 14px; height: 14px; }
.ctrl-btn:hover { background: var(--paper-2); }
.counter { font-size: 1rem; color: var(--gray); font-variant-numeric: tabular-nums; min-width: 4.2em; text-align: center; }
.counter b { color: var(--ink); font-weight: 600; }
.works-progress { position: relative; height: 1px; background: var(--ink); margin: 0 var(--gutter); }
.works-progress i { position: absolute; left: 0; top: -1px; height: 3px; background: var(--ink); transition: transform .9s var(--ease); }
@media (min-width: 900px) {
  .works-grid { grid-template-columns: 62% 1fr; column-gap: 0; row-gap: 22px; }
  .works-stage { aspect-ratio: auto; height: clamp(380px, 40vw, 620px); margin: 0; }
  .works-side { justify-content: flex-start; padding-bottom: 4px; }
  .works-caption { margin-top: auto; }
  .works-ribbon { margin-top: clamp(40px, 7vw, 120px); }
  .works-caption, .works-ctrl { padding: 0 var(--gutter) 0 40px; }
  .works-progress { grid-column: 1; margin: 0 0 0 var(--gutter); }
}
@media (prefers-reduced-motion: reduce) { .wr-track { animation: none; } .work-slide { transition: opacity .3s; } }

/* ---------- 3. NOSOTROS + MÉTRICAS ---------- */
/* Estilo editorial: fondo claro, tipografía grande y divisores finos (sin bloque negro) */
.about-band { display: grid; gap: 40px; }
.about-copy { position: relative; }
.about-copy .h-md { font-size: clamp(2.6rem, 4.4vw, 4.8rem); line-height: .92; margin-bottom: 22px; max-width: 14ch; }
.about-text { font-size: clamp(1rem, 1.2vw, 1.12rem); line-height: 1.65; margin: 0 0 26px; color: #5c5c59; max-width: 52ch; }
.about-motto { display: flex; align-items: center; gap: 12px; margin: 0; font-weight: 600; color: var(--orange); }
.about-band-solo .eyebrow { margin-bottom: 0; }
@media (min-width: 1080px) { .about-band { grid-template-columns: .85fr 1.15fr; align-items: center; gap: clamp(48px, 6vw, 120px); } .about-band-solo { grid-template-columns: 1fr; gap: 24px; } }
/* Métricas rotativas: 2 lugares; en cada uno los datos se van reemplazando */
.metrics { display: grid; grid-template-columns: 1fr 1fr; }
.metric-slot { position: relative; display: grid; padding: 30px 16px 8px 0; border-top: 1px solid var(--line); overflow: hidden; }
.metric-slot + .metric-slot { padding-left: clamp(16px, 2.4vw, 40px); border-left: 1px solid var(--line); }
/* Línea de avance: se llena sobre el borde superior y, al completarse, cambia el dato */
.metric-bar { position: absolute; top: -1px; left: 0; height: 2px; width: 100%; background: var(--orange); transform: scaleX(0); transform-origin: left; }
.metric-slot.is-running .metric-bar { animation: metricBar var(--metric-t, 4.2s) linear forwards; }
.metrics:hover .metric-bar, .metric-slot.is-paused .metric-bar { animation-play-state: paused; }
@keyframes metricBar { to { transform: scaleX(1); } }
.metric { grid-area: 1 / 1; display: flex; flex-direction: column; gap: 12px; opacity: 0; transform: translateY(28px); transition: opacity .5s, transform .7s var(--ease); pointer-events: none; }
.metric.is-active { opacity: 1; transform: none; pointer-events: auto; }
.metric.is-out { opacity: 0; transform: translateY(-28px); }
.metric-num { font-family: var(--f-display); font-size: clamp(4rem, 8vw, 8.4rem); line-height: .85; color: var(--ink); font-variant-numeric: tabular-nums; }
.metric-slot:first-child .metric-num { color: var(--orange); }
.metric-num small { font-family: var(--f-body); font-weight: 500; font-size: .24em; margin-left: .15em; letter-spacing: 0; }
.metric-label { color: #5c5c59; font-size: .95rem; max-width: 24ch; line-height: 1.4; min-height: 2.8em; }
@media (prefers-reduced-motion: reduce) { .metric { transition: none; } }

/* ---------- 4. PRODUCTOS ---------- */
.product-grid, .sub-grid { display: grid; gap: 16px; }
@media (min-width: 640px) { .product-grid, .sub-grid { grid-template-columns: 1fr 1fr; gap: 20px; } }
@media (min-width: 1080px) { .product-grid, .sub-grid { grid-template-columns: repeat(3, 1fr); gap: 24px; } }
.product-card { border-radius: var(--radius); background: #fff; border: 1px solid var(--line); overflow: hidden; transition: box-shadow .4s, transform .4s var(--ease), border-color .4s; }
.product-card:hover { box-shadow: 0 30px 50px -30px rgba(29, 29, 27, .35); border-color: transparent; transform: translateY(-4px); }
.product-link { display: flex; flex-direction: column; height: 100%; }
.product-media { aspect-ratio: 16 / 10; overflow: hidden; }
.product-media > * { width: 100%; height: 100%; object-fit: cover; transition: transform .8s var(--ease); }
.product-card:hover .product-media > * { transform: scale(1.05); }
.product-body { padding: 24px 24px 26px; display: flex; flex-direction: column; flex: 1; }
.product-body p { color: #5c5c59; margin: 10px 0 18px; font-size: .95rem; }
.tags { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin: 0 0 22px; }
.tags li { font-size: .78rem; padding: 5px 11px; border-radius: 999px; background: var(--paper-2); color: #4b4b48; }
.tags-dark li { background: rgba(252, 251, 250, .08); color: var(--paper); border: 1px solid var(--line-light); }
.more { margin-top: auto; display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: .92rem; color: var(--ink); }
.more .arrow { width: 18px; color: var(--orange); transition: transform .3s var(--ease); }
.product-card:hover .more .arrow, .more:hover .arrow { transform: translateX(5px); }

/* Lista de categorías (izquierda) + detalle de la activa (derecha) */
.svc { display: grid; gap: 28px; }
.svc-list { display: flex; flex-direction: column; }
.svc-item { display: flex; align-items: flex-start; gap: 12px; padding: 5px 0; text-align: left; color: #A9A49D; transition: color .35s; }
.svc-num { flex: none; width: 1.8em; padding-top: .4em; font-size: .68rem; font-weight: 500; color: var(--gray-l); font-variant-numeric: tabular-nums; transition: color .35s; }
.svc-name { font-size: var(--fs-sub); }
.svc-item:hover, .svc-item.is-active { color: var(--ink); }
.svc-item.is-active .svc-num { color: var(--orange); }
.svc-item:focus-visible { outline-offset: 4px; }
.svc-panels { display: grid; }
.svc-panel { grid-area: 1 / 1; opacity: 0; visibility: hidden; transform: translateY(10px); transition: opacity .45s, transform .55s var(--ease), visibility 0s .45s; }
.svc-panel.is-active { opacity: 1; visibility: visible; transform: none; transition: opacity .45s .05s, transform .55s var(--ease) .05s, visibility 0s; }
.svc-media { aspect-ratio: 16 / 9; max-height: 34vh; width: 100%; border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 20px; }
.svc-media > * { width: 100%; height: 100%; object-fit: cover; }
.svc-panel .tags { margin-bottom: 16px; }
.svc-desc { margin: 0 0 22px; color: #5c5c59; max-width: 46ch; }
.svc-more { position: relative; display: flex; align-items: center; gap: 6px; padding-bottom: 14px; border-bottom: 1px solid var(--line); color: var(--orange); font-weight: 600; font-size: .92rem; }
.svc-more span { transition: transform .3s var(--ease); }
.svc-more:hover span { transform: translateX(4px); }
/* Línea que se llena: cuando termina, pasa a la categoría siguiente */
.svc-bar { position: absolute; left: 0; bottom: -1px; width: 100%; height: 1px; background: var(--ink); transform: scaleX(0); transform-origin: left; }
.svc-panel.is-active .svc-bar { animation: svcBar 6s linear forwards; }
.svc.is-paused .svc-bar, .svc:not(.is-visible) .svc-bar { animation-play-state: paused; }
@keyframes svcBar { to { transform: scaleX(1); } }
.svc-custom { margin: 22px 0 0; font-size: .9rem; color: var(--gray); }
.svc-custom a { color: var(--ink); font-weight: 600; }
.svc-custom a:hover { color: var(--orange); }
@media (min-width: 900px) {
  .svc { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: clamp(40px, 6vw, 96px); align-items: start; }
  /* Versión espejada: imagen y detalle a la izquierda, lista a la derecha */
  /* El título de la sección también va a la derecha, arriba de la lista */
  /* El título va arriba a la derecha y la imagen queda centrada respecto de la lista */
  .svc-mirror { grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); grid-template-rows: auto auto; row-gap: 0; }
  .svc-mirror .svc-main { display: contents; }
  .svc-mirror .section-head { grid-column: 2; grid-row: 1; }
  .svc-mirror .svc-list { grid-column: 2; grid-row: 2; }
  .svc-mirror .svc-side { grid-column: 1; grid-row: 2; align-self: center; }
  .svc-mirror .section-head { margin-bottom: clamp(20px, 3vh, 36px); }
  .svc-mirror .section-head-row { display: block; }
  .svc-mirror .section-head-row .lead { margin-top: 12px; }
  /* Todo el bloque de texto alineado contra el borde derecho */
  .svc-mirror .svc-main { text-align: right; }
  .svc-mirror .eyebrow { justify-content: flex-end; }
  .svc-mirror .section-head-row .h-lg, .svc-mirror .section-head-row .lead { margin-left: auto; }
  .svc-mirror .svc-list { align-items: flex-end; }
  .svc-mirror .svc-item { flex-direction: row-reverse; text-align: right; }
}
@media (max-width: 899px) {
  .svc { gap: 20px; }
  .svc-name { font-size: clamp(1.15rem, 4.8vw, 1.45rem); }
  .svc-media { display: none; }
  .svc-desc { margin-bottom: 16px; }
}
@media (prefers-reduced-motion: reduce) { .svc-panel.is-active .svc-bar { animation: none; transform: scaleX(1); } }

/* ---------- 5. TECNOLOGÍA ---------- */
/* Placeholder de tecnología: el ícono grande en naranja mientras no haya foto */
.tech-ph .tech-icon { width: clamp(56px, 6vw, 88px); height: auto; margin: 0; color: var(--orange); stroke-width: 1.2; }
/* Grilla de tecnología: solo líneas interiores. Cada tarjeta dibuja su borde superior e izquierdo
   y se corre 1px hacia afuera; los bordes que caen en el contorno quedan recortados. */
.tech-grid { display: grid; overflow: hidden; }
.tech-card { position: relative; margin: -1px 0 0 -1px; border-top: 1px solid var(--line); border-left: 1px solid var(--line); padding: 30px 26px 32px; }
@media (max-width: 639px) { .tech-card { padding-left: 0; padding-right: 0; } .tech-card .tech-idx { right: 0; } }
@media (min-width: 640px) and (max-width: 1079px) {
  .tech-grid { grid-template-columns: 1fr 1fr; }
  .tech-card:nth-child(2n+1) { padding-left: 0; }
  .tech-card:nth-child(2n) .tech-idx { right: 0; }
}
@media (min-width: 1080px) {
  .tech-grid { grid-template-columns: repeat(3, 1fr); }
  .tech-card:nth-child(3n+1) { padding-left: 0; }
  .tech-card:nth-child(3n) .tech-idx { right: 0; }
}
.tech-idx { font-family: var(--f-display); font-size: 1.1rem; color: var(--gray-l); letter-spacing: .05em; }
.tech-card .tech-idx { position: absolute; top: 24px; right: 26px; }
.tech-icon { width: 44px; height: 44px; color: var(--orange); margin-bottom: 26px; transition: transform .4s var(--ease); }
.tech-card:hover .tech-icon { transform: scale(1.1) rotate(-4deg); }
.tech-card h3 { margin: 0 0 6px; font-size: 1.12rem; font-weight: 600; }
.tech-card p { margin: 0; color: var(--gray); font-size: .93rem; }

/* ---------- 6. CREÁ TU EXHIBIDOR ---------- */
/* Estilo editorial: fondo claro, texto a la izquierda e ilustración en un recuadro redondeado */
.exh { display: grid; gap: 40px; position: relative; }
.exh-copy { position: relative; }
.exh-copy .h-lg { margin-bottom: 18px; max-width: 14ch; }
.exh-copy .lead { margin-bottom: 28px; }
/* Pasos numerados: mismo lenguaje que la lista de Productos/Tecnología (número naranja + nombre en display) */
.exh-steps { list-style: none; padding: 0; margin: 0 0 22px; border-top: 1px solid var(--line); }
.exh-steps li { display: grid; grid-template-columns: 44px 1fr; column-gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.exh-n { grid-row: span 2; padding-top: .45em; font-size: .7rem; font-weight: 600; letter-spacing: .16em; color: var(--orange); }
.exh-steps h3 { font-size: clamp(1.1rem, 1.25vw, 1.3rem); }
.exh-steps p { margin: 4px 0 0; color: #5c5c59; font-size: .95rem; }
.exh .tags { margin-bottom: 28px; }
.exh-visual { position: relative; display: grid; place-items: center; aspect-ratio: 16 / 11; border-radius: var(--radius-sm); overflow: hidden; background: repeating-linear-gradient(135deg, transparent 0 22px, rgba(255, 255, 255, .03) 22px 23px), radial-gradient(120% 90% at 85% 10%, #3a3a37 0%, var(--ink) 60%); }
.exh-visual img { width: 100%; height: 100%; object-fit: cover; }
.exh-svg { width: min(100%, 270px); }
.exh-shelf { opacity: 0; transform: translateY(12px); transition: opacity .6s, transform .6s var(--ease); transition-delay: calc(.5s + var(--k) * .15s); }
.exh.is-in .exh-shelf { opacity: 1; transform: none; }
.exh-dim { stroke-dasharray: 340; stroke-dashoffset: 340; transition: stroke-dashoffset 1.4s var(--ease) 1.2s; }
.exh.is-in .exh-dim { stroke-dashoffset: 0; }
.exh-line { stroke: var(--line-light); }
@media (min-width: 900px) { .exh { grid-template-columns: 1fr 1fr; align-items: center; gap: clamp(48px, 6vw, 120px); } }

/* ---------- 7. CLIENTES (marquesina) ---------- */
.marquee { display: flex; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
.marquee-track { list-style: none; display: flex; flex: none; margin: 0; padding: 0; animation: marquee 40s linear infinite; }
.marquee:hover .marquee-track { animation-play-state: paused; }
.marquee .marquee-track { animation-duration: var(--speed, 40s); }
.marquee.is-reverse .marquee-track { animation-direction: reverse; }

/* ---------- Página Nosotros: capacidades y equipo ---------- */
/* Capacidades: misma grilla de líneas interiores que Tecnología, sin íconos */
.cap-grid { display: grid; overflow: hidden; }
.cap-item { margin: -1px 0 0 -1px; border-top: 1px solid var(--line); border-left: 1px solid var(--line); padding: 26px 26px 30px; }
.cap-n { display: block; margin-bottom: 14px; font-size: .7rem; font-weight: 600; letter-spacing: .16em; color: var(--orange); }
.cap-title { margin: 0 0 8px; font-family: var(--f-body); font-weight: 300; font-size: var(--fs-sub); letter-spacing: -.015em; line-height: 1.2; }
.cap-item p, .team-card > p:last-child { margin: 0; color: #5c5c59; font-size: .95rem; max-width: 40ch; }
@media (max-width: 639px) { .cap-item { padding-left: 0; padding-right: 0; } }
@media (min-width: 640px) and (max-width: 1079px) { .cap-grid { grid-template-columns: 1fr 1fr; } .cap-item:nth-child(2n+1) { padding-left: 0; } }
@media (min-width: 1080px) { .cap-grid { grid-template-columns: repeat(3, 1fr); } .cap-item:nth-child(3n+1) { padding-left: 0; } }
/* Equipo: foto grupal a la izquierda + áreas en 2 columnas a la derecha (solo líneas interiores).
   Pensado para verse completo en una pantalla de escritorio. */
.team-layout { display: grid; gap: 28px; }
.team-photo { aspect-ratio: 4 / 3; border-radius: var(--radius); overflow: hidden; }
.team-photo > * { width: 100%; height: 100%; object-fit: cover; }
.team-grid { display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; align-content: stretch; }
.team-card { margin: -1px 0 0 -1px; border-top: 1px solid var(--line); border-left: 1px solid var(--line); padding: clamp(14px, 2.2vh, 24px) 20px; display: flex; flex-direction: column; justify-content: center; }
.team-card:nth-child(2n+1) { padding-left: 0; }
.team-card .tl-top { margin-bottom: 8px; }
.team-card .cap-title { font-size: clamp(1.1rem, 1.3vw, 1.4rem); margin-bottom: 6px; }
.team-card > p:last-child { font-size: .9rem; line-height: 1.5; }
@media (min-width: 1000px) {
  .team-layout { grid-template-columns: 1.15fr 1fr; gap: clamp(40px, 4vw, 72px); align-items: stretch; }
  /* La foto acompaña el alto de las áreas, con un tope para que todo entre en pantalla */
  .team-photo { aspect-ratio: auto; height: 100%; min-height: 320px; }
  /* Título y bajada siempre en la misma fila, para ahorrar alto */
  #equipo .section-head { margin-bottom: clamp(20px, 3vh, 36px); }
  #equipo .section-head-row { flex-wrap: nowrap; }
  #equipo .section-head-row .lead { max-width: 34ch; }
}
@media (min-width: 1000px) and (max-height: 820px) {
  .team-card { padding-top: 12px; padding-bottom: 12px; }
  .team-card > p:last-child { font-size: .85rem; }
  #equipo .h-lg { font-size: clamp(2.4rem, 4vw, 3.8rem); }
}
@media (max-width: 639px) { .team-grid { grid-template-columns: 1fr; } .team-card { padding-left: 0; padding-right: 0; } }

/* ---------- Página Clientes: todo en una pantalla ---------- */
.cl-page { min-height: 100svh; display: flex; flex-direction: column; justify-content: space-between; gap: clamp(20px, 3.5vh, 44px); padding: calc(var(--header-h) + 24px) 0 clamp(24px, 4vh, 48px); }
.cl-page .crumbs { margin-bottom: clamp(16px, 2.5vh, 28px); }
.cl-page .h-hero-page { margin-bottom: 14px; }
.cl-head { --t: clamp(2.6rem, 4.6vw, 4.6rem); display: grid; }
.cl-head .cl-title { font-size: var(--t); }
.cl-num { color: var(--orange); font-size: 4rem; line-height: .8; margin: 18px 0 6px; }
.cl-num-label { margin: 0; }
/* En celular: título, bajada, y después el número con su frase (juntos) */
.cl-eb { order: 1; } .cl-title { order: 2; } .cl-lead { order: 3; } .cl-num { order: 4; } .cl-num-label { order: 5; }
@media (min-width: 1000px) {
  /* Fila 1: etiqueta a todo el ancho. Fila 2: título | número (misma base y misma altura).
     Fila 3: bajada | frase del número (mismo tamaño y misma línea). */
  .cl-head { grid-template-columns: 1fr auto; column-gap: 64px; }
  .cl-eb { grid-column: 1 / -1; }
  .cl-title { grid-column: 1; grid-row: 2; align-self: last baseline; }
  .cl-num { grid-column: 2; grid-row: 2; align-self: last baseline; justify-self: end; margin: 0; font-size: calc(var(--t) * 2.3); line-height: .9; }
  .cl-lead { grid-column: 1; grid-row: 3; }
  .cl-num-label { grid-column: 2; grid-row: 3; justify-self: end; text-align: right; }
}
.cl-marquees .marquee li { height: clamp(80px, 11vh, 110px); }
/* Al pasar el mouse se frenan las dos cintas juntas */
.cl-marquees:hover .marquee-track { animation-play-state: paused; }
.marquee .logo-ph b { white-space: nowrap; }
@media (max-width: 639px) {
  .cl-marquees .marquee li { height: 62px; width: 150px; padding: 0 14px; }
  .cl-marquees .logo-ph b { font-size: 1.25rem; }
  .cl-marquees .logo-ph svg { width: 18px; height: 18px; }
}
.cl-cta { display: grid; gap: 20px; }
.cl-cta .h-md { max-width: 22ch; }
@media (min-width: 900px) { .cl-cta { grid-template-columns: 1fr auto; align-items: center; } }
/* En Clientes el cierre ya tiene WhatsApp: el botón flotante taparía esos botones */
body[data-page="clientes"] .wa-float-wrap { display: none; }
@keyframes marquee { to { transform: translateX(-100%); } }
@media (prefers-reduced-motion: reduce) { .marquee-track { animation: none; } .marquee { overflow-x: auto; } }
.marquee li { width: clamp(170px, 18vw, 240px); height: 120px; display: grid; place-items: center; border-right: 1px solid var(--line); padding: 0 28px; }
.marquee img { max-height: 56px; width: auto; filter: grayscale(1) opacity(.65); transition: filter .35s; }
.mq-logo { display: grid; place-items: center; min-width: 0; }
.mq-logo:hover img { filter: none; }
.marquee.is-double li { grid-template-rows: 1fr 1fr; place-items: stretch; }
.logo-ph { display: inline-flex; align-items: center; gap: 10px; color: var(--gray); transition: color .35s; }
.logo-ph svg { width: 26px; height: 26px; fill: currentColor; }
.logo-ph b { font-family: var(--f-display); font-weight: 400; font-size: 1.7rem; letter-spacing: .03em; }
.mq-logo:hover .logo-ph { color: var(--c); }

/* ---------- 8. TALLER ---------- */
/* Columnas editoriales: línea negra arriba, divisores finos, imágenes sin redondear */
.tl-grid { display: grid; }
.tl-col { display: flex; flex-direction: column; padding: 20px 0 36px; border-bottom: 1px solid var(--line); }
.tl-top { display: flex; justify-content: space-between; margin: 0 0 18px; font-size: .7rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--gray); }
.tl-top span:first-child { color: var(--orange); }
.tl-title { font-size: var(--fs-sub); margin: 0 0 20px; }
.tl-media { aspect-ratio: 16 / 10; overflow: hidden; margin-bottom: 18px; border-radius: var(--radius-sm); }
.tl-media > * { width: 100%; height: 100%; object-fit: cover; transition: transform .9s var(--ease); }
.tl-col:hover .tl-media > * { transform: scale(1.04); }
.tl-text { margin: 0 0 18px; color: #5c5c59; max-width: 46ch; }
/* El "24 h" del gremio ocupa el lugar de la imagen */
.tl-big { display: flex; justify-content: center; align-items: center; background: var(--ink); color: var(--orange); font-family: var(--f-display); font-size: clamp(6rem, 10vw, 12rem); line-height: 1; }
.tl-big > span { width: auto; height: auto; }
.tl-big small { font-size: .35em; margin-left: .06em; color: var(--paper); }
.tl-link { margin-top: auto; align-self: stretch; padding-bottom: 0; border-bottom: 0; }
@media (max-width: 899px) { .tl-media { aspect-ratio: 16 / 9; } .tl-big { font-size: 5.5rem; } }
@media (min-width: 900px) {
  /* subgrid: títulos, imágenes y textos quedan alineados entre columnas */
  .tl-grid { --tl-gap: clamp(40px, 4.8vw, 80px); grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(5, auto); column-gap: var(--tl-gap); }
  .tl-col { position: relative; display: grid; grid-row: span 5; grid-template-rows: subgrid; align-content: start; padding: 22px 0 8px; border-bottom: 0; }
  .tl-title { align-self: end; }
  /* Divisor fino entre columnas, centrado en el espacio entre ellas */
  .tl-col + .tl-col::before { content: ""; position: absolute; top: 0; bottom: 0; left: calc(var(--tl-gap) / -2); border-left: 1px solid var(--line); }
}

/* ---------- 9. FAQ ---------- */
.faq-wrap { display: grid; gap: 40px; }
.faq-side .h-lg { margin-bottom: 18px; }
.faq-side .muted { margin: 0 0 26px; }
@media (min-width: 1000px) { .faq-wrap { grid-template-columns: 1fr 1.3fr; gap: 80px; } .faq-side { position: sticky; top: calc(var(--header-h) + 32px); align-self: start; } }
/* Sin borde superior: la línea naranja del título "FAQ" ya cumple de separador */
.faq-list { padding-top: 12px; }

/* ---------- WhatsApp flotante ---------- */
/* Píldora negra dentro de un contenedor gris claro */
.wa-float-wrap {
  position: fixed; right: 12px; bottom: 12px; z-index: 70; padding: 8px; border-radius: 999px;
  isolation: isolate; transition: opacity .3s;
}
/* Animación en loop (~3 s): el halo gris se expande y se desvanece; después la píldora "respira" */
.wa-float-wrap::before {
  content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 999px;
  background: rgba(225, 223, 220, .9); animation: waHalo 3.2s cubic-bezier(.2, .6, .3, 1) infinite;
}
.wa-float { animation: waPill 3.2s ease-in-out infinite; }
@keyframes waHalo {
  0% { inset: 0; opacity: 1; }
  38% { inset: -26px; opacity: .35; }
  52% { inset: -30px; opacity: 0; }
  100% { inset: 0; opacity: 0; }
}
@keyframes waPill {
  0%, 38% { transform: scale(1); }
  52% { transform: scale(1.07); }
  72% { transform: scale(.93); }
  88%, 100% { transform: scale(1); }
}
.wa-float-wrap:hover::before, .wa-float-wrap:hover .wa-float { animation-play-state: paused; }
@media (prefers-reduced-motion: reduce) { .wa-float-wrap::before, .wa-float { animation: none; } }
/* Mismo tamaño y tipografía que los botones del sitio (.btn), y su borde derecho cae justo en el
   borde del contenido (el mismo que el botón "Cotizar por WhatsApp" del menú). */
.wa-float {
  display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 24px; border-radius: 999px;
  background: var(--orange); color: #fff; font-weight: 600; font-size: .95rem; letter-spacing: .01em; white-space: nowrap;
  transition: background .3s, transform .3s var(--ease);
}
.wa-float svg { width: 20px; height: 20px; color: #fff; }
.wa-float:hover { background: var(--orange-d); }
.wa-float-wrap {
  --edge: max(var(--gutter), calc((100vw - 1840px) / 2 + var(--gutter)));
  right: calc(var(--edge) - 8px); bottom: calc(var(--edge) - 8px);
}
@media (min-width: 768px) { .wa-float-wrap { bottom: 24px; } }
@media (max-width: 767px) { .wa-float { height: 46px; padding: 0 18px; font-size: .9rem; } }
.menu-open .wa-float-wrap { opacity: 0; pointer-events: none; }

  function initReveal() {
    const els = $$("[data-reveal], .eyebrow[data-node]");
    if (reduced) return els.forEach((el) => el.classList.add("is-in"));
    // Los títulos que maneja la línea de recorrido (desktop) no se revelan por acá.
    const owned = window.__routeOwns || new Set();
    els.forEach((el) => { if (!owned.has(el)) watch(el, () => el.classList.add("is-in")); });
    checkWatchers();
  }

  /* ---------- Contadores animados ---------- */
  const fmtNum = (n) => n.toLocaleString("es-AR");
  // El sufijo (m², %) se muestra más chico que el número.
  const paintCount = (el, n) => {
    const suf = el.dataset.suffix.trim();
    el.innerHTML = VT.esc(el.dataset.prefix) + fmtNum(n) + (suf ? `<small>${VT.esc(suf)}</small>` : "");
  };
  const countUp = (el, dur = 1500) => {
    const end = +el.dataset.count;
    if (reduced) return paintCount(el, end);
    const t0 = performance.now();
    const tick = (t) => {
      const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 4);
      paintCount(el, Math.round(end * e));
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  };

  function initCounters() {
    // Los de las métricas rotativas los maneja initMetrics.
    const els = $$("[data-count]").filter((el) => !el.closest("[data-metric-slot]"));
    if (reduced) return els.forEach((el) => paintCount(el, +el.dataset.count));
    els.forEach((el) => { paintCount(el, 0); watch(el, () => countUp(el, 1700), null, 0.85); });
    checkWatchers();
  }

  /* ---------- Métricas rotativas ----------
     Cada lugar muestra un dato; cuando la línea naranja de arriba se llena, entra el siguiente.
     El segundo lugar arranca desfasado para que no cambien los dos a la vez. */
  function initMetrics() {
    $$("[data-metric-slot]").forEach((slot) => {
      const items = $$(".metric", slot);
      const bar = $(".metric-bar", slot);
      const num = (k) => $("[data-count]", items[k]);
      let i = 0, started = false;
      items.forEach((it, k) => paintCount(num(k), k ? +num(k).dataset.count : 0));
      const restartBar = () => { slot.classList.remove("is-running"); void bar.offsetWidth; slot.classList.add("is-running"); };
      bar.addEventListener("animationend", () => {
        bar.style.animationDelay = "";
        if (items.length < 2) return;
        const prev = i;
        i = (i + 1) % items.length;
        items.forEach((it) => it.classList.remove("is-out"));
        items[prev].classList.replace("is-active", "is-out");
        items[i].classList.add("is-active");
        paintCount(num(i), 0);
        countUp(num(i));
        restartBar();
      });
      watch(slot, () => {
        slot.classList.remove("is-paused");
        if (started) return;
        started = true;
        countUp(num(0));
        // Desfase del segundo lugar: media vuelta.
        if (+getComputedStyle(slot).getPropertyValue("--offset") === 1) bar.style.animationDelay = "2.1s";
        restartBar();
      }, () => slot.classList.add("is-paused"), 0.85);
    });
    checkWatchers();
  }

  /* ---------- Slider de trabajos ---------- */
  function initSlider() {
    // Slider apilado: la diapositiva activa entra desde la derecha y la anterior queda asomando a la izquierda.
    const root = $("[data-slider]");
    if (!root) return window.__sliderStop?.();
    const slides = $$(".work-slide", root);
    const items = S.trabajos.items;
    const n = slides.length;
    const cur = $("[data-counter-current]", root), title = $("[data-work-title]", root), type = $("[data-work-type]", root);
    const bar = $("[data-progress]", root);
    let i = 0, timer = null, paused = false;
    window.__sliderStop?.(); // si se vuelve a armar la home, se corta el temporizador anterior
    window.__sliderStop = () => clearInterval(timer);
    bar.style.width = `${100 / n}%`;
    const go = (to, dir = 1) => {
      const prev = i;
      i = (to + n) % n;
      if (i === prev) return;
      slides.forEach((s, k) => {
        s.classList.remove("is-active", "is-prev", "from-left");
        if (k === i) { s.classList.add("is-active"); if (dir < 0) s.classList.add("from-left"); }
        else if (k === prev) s.classList.add("is-prev");
      });
      cur.textContent = VT.pad(i + 1);
      title.textContent = items[i].cliente;
      type.textContent = items[i].tipo;
      bar.style.transform = `translateX(${i * 100}%)`;
    };
    slides[n - 1].classList.add("is-prev");
    const next = () => go(i + 1, 1);
    const start = () => { if (reduced) return; clearInterval(timer); timer = setInterval(() => { if (!paused && !document.hidden) next(); }, 5500); };
    $$("[data-slide]", root).forEach((b) => b.addEventListener("click", () => { go(i + +b.dataset.slide, +b.dataset.slide); start(); }));
    root.addEventListener("mouseenter", () => (paused = true));
    root.addEventListener("mouseleave", () => (paused = false));
    root.addEventListener("focusin", () => (paused = true));
    root.addEventListener("focusout", () => (paused = false));
    root.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") { go(i + 1, 1); start(); }
      if (e.key === "ArrowLeft") { go(i - 1, -1); start(); }
    });
    // Deslizar con el dedo o el mouse
    const stage = $(".works-stage", root);
    let sx = null;
    stage.addEventListener("pointerdown", (e) => { sx = e.clientX; });
    stage.addEventListener("pointerup", (e) => {
      if (sx === null) return;
      const dx = e.clientX - sx; sx = null;
      if (Math.abs(dx) > 40) { go(i + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1); start(); }
    });
    start();
  }

  /* ---------- Productos: lista + detalle ---------- */
  function initSvc() {
    $$("[data-svc]").forEach(initSvcOne);
  }
  function initSvcOne(root) {
    const tabs = $$(".svc-item", root), panels = $$(".svc-panel", root);
    let cur = 0;
    const set = (to, focus = false) => {
      const i = (to + tabs.length) % tabs.length;
      if (i === cur) return;
      [[cur, false], [i, true]].forEach(([k, on]) => {
        tabs[k].classList.toggle("is-active", on);
        tabs[k].setAttribute("aria-selected", on);
        tabs[k].tabIndex = on ? 0 : -1;
        panels[k].classList.toggle("is-active", on);
        on ? panels[k].removeAttribute("aria-hidden") : panels[k].setAttribute("aria-hidden", "true");
        $(".svc-more", panels[k]).tabIndex = on ? 0 : -1;
      });
      cur = i;
      if (focus) tabs[i].focus();
    };
    const canHover = window.matchMedia("(hover: hover)").matches;
    tabs.forEach((t, i) => {
      if (canHover) t.addEventListener("mouseenter", () => set(i));
      t.addEventListener("click", () => set(i));
      t.addEventListener("focus", () => set(i));
    });
    $(".svc-list", root).addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown" || e.key === "ArrowRight") { e.preventDefault(); set(cur + 1, true); }
      if (e.key === "ArrowUp" || e.key === "ArrowLeft") { e.preventDefault(); set(cur - 1, true); }
    });
    // Avance automático: cuando la línea de "Ver más" termina de llenarse.
    panels.forEach((p) => $(".svc-bar", p).addEventListener("animationend", () => set(cur + 1)));
    const pause = (v) => root.classList.toggle("is-paused", v);
    root.addEventListener("mouseenter", () => pause(true));
    root.addEventListener("mouseleave", () => pause(false));
    root.addEventListener("focusin", () => pause(true));
    root.addEventListener("focusout", () => pause(false));
    // La línea de avance solo corre mientras la sección está en pantalla.
    watch(root, () => root.classList.add("is-visible"), () => root.classList.remove("is-visible"), 0.8);
  }

  /* ---------- FAQ ---------- */
  function initFaq() {
    $$(".faq-q").forEach((q) => q.addEventListener("click", () => {
      const item = q.closest(".faq-item");
      const open = !item.classList.contains("is-open");
      $$(".faq-item.is-open").forEach((o) => { o.classList.remove("is-open"); $(".faq-q", o).setAttribute("aria-expanded", "false"); });
      item.classList.toggle("is-open", open);
      q.setAttribute("aria-expanded", open);
    }));
  }

  /* ---------- Línea de recorrido ---------- */
  function initRoute() {
    const svg = $(".route");
    if (!svg) return;
    const path = $(".route-path", svg), nodesG = $(".route-nodes", svg);
    let len = 0, y0 = 0, y1 = 0, nodeYs = [], nodes = [], active = false;
    // Posición real en el documento, sin contar las animaciones (transform) de aparición.
    const docTop = (el) => { let y = 0; while (el) { y += el.offsetTop; el = el.offsetParent; } return y; };
    // Cada título de sección aparece cuando la línea llega a su punto.
    const targets = (n) => [n, n.closest("[data-reveal]")].filter(Boolean);
    const build = () => {
      const container = $("#app-main .container");
      nodes = $$("#app-main .eyebrow[data-node]");
      if (!container || nodes.length < 2) return;
      const left = container.getBoundingClientRect().left + parseFloat(getComputedStyle(container).paddingLeft);
      const x = Math.round(left - 40);
      window.__routeX = x;
      svg.classList.toggle("is-off", x < 20);
      active = getComputedStyle(svg).display !== "none" && !reduced;
      // Con la línea activa, el rombo del título se oculta: queda uno solo, el de la línea.
      document.documentElement.classList.toggle("route-on", getComputedStyle(svg).display !== "none");
      sizeEyebrowLines(); // al ocultarse el rombo del título, el texto se corre: se recalcula el largo de la línea
      if (!active) nodes.forEach((n) => targets(n).forEach((t) => t.classList.add("is-in")));
      // La altura sale de #app-main (no del documento) para no agregar scroll de más.
      const main = $("#app-main");
      const mainTop = docTop(main);
      const h = main.offsetHeight;
      svg.setAttribute("width", document.documentElement.clientWidth);
      svg.setAttribute("height", h);
      svg.style.height = h + "px";
      nodeYs = nodes.map((n) => Math.round(docTop(n) - mainTop + n.offsetHeight / 2));
      y0 = nodeYs[0]; y1 = nodeYs[nodeYs.length - 1];
      path.setAttribute("d", `M${x} ${y0} V${y1}`);
      // El trazo horizontal llega hasta donde empieza cada título (aunque esté a la derecha).
      // Se mide desde el rombo del título: el contenedor puede ocupar toda la columna con el texto empujado a la derecha.
      const ends = nodes.map((n) => Math.round(($(".eb-t", n) || n).getBoundingClientRect().left + window.scrollX - 10));
      nodesG.innerHTML = nodeYs.map((y, i) =>
        `<rect class="route-node" data-i="${i}" x="${x - 4}" y="${y - 4}" width="8" height="8"/><path class="route-tick" data-i="${i}" d="M${x + 6} ${y} H${ends[i]}"/>`).join("");
      len = path.getTotalLength();
      path.style.strokeDasharray = len;
      draw();
    };
    const draw = () => {
      if (!len) return;
      const pos = window.scrollY + window.innerHeight * 0.62 - docTop($("#app-main"));
      const p = Math.max(0, Math.min(1, (pos - y0) / (y1 - y0)));
      path.style.strokeDashoffset = reduced ? 0 : len * (1 - p);
      $$(".route-node, .route-tick", nodesG).forEach((n) => n.classList.toggle("on", reduced || nodeYs[n.dataset.i] <= pos + 2));
      // El título aparece cuando la línea llega a su rombo y se oculta si se vuelve a subir,
      // así la animación se repite cada vez que se baja (y el rombo y el título siempre coinciden).
      if (active) nodes.forEach((n, k) => { const on = nodeYs[k] <= pos + 2; targets(n).forEach((t) => t.classList.toggle("is-in", on)); });
    };
    build();
    window.__routeOwns = active ? new Set(nodes.flatMap(targets)) : new Set();
    // Los eventos globales se enganchan una sola vez y siempre llaman a la versión de la página actual.
    window.__routeDraw = draw;
    window.__routeBuild = build;
    if (initRoute.bound) return;
    initRoute.bound = true;
    window.addEventListener("scroll", () => requestAnimationFrame(() => window.__routeDraw?.()), { passive: true });
    let t; const rebuild = () => { clearTimeout(t); t = setTimeout(() => window.__routeBuild?.(), 120); };
    window.addEventListener("resize", rebuild);
    window.addEventListener("load", rebuild);
    if (document.fonts) document.fonts.ready.then(rebuild);
    if ("ResizeObserver" in window) new ResizeObserver(rebuild).observe($("#app-main"));
  }

  /* ---------- Leads ---------- */
  async function saveLead(lead) {
    const record = { ...lead, pagina: location.pathname + location.search, creado: new Date().toISOString() };
    if (C.supabaseUrl && C.supabaseAnonKey) {
      const res = await fetch(`${C.supabaseUrl.replace(/\/$/, "")}/rest/v1/${C.tablaLeads}`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          apikey: C.supabaseAnonKey,
          Authorization: `Bearer ${C.supabaseAnonKey}`,
          Prefer: "return=minimal",
        },
        body: JSON.stringify({
          origen: record.origen, nombre: record.nombre, empresa: record.empresa || null,
          email: record.email, telefono: record.telefono || null,
          productos: record.productos || null, mensaje: record.mensaje || null, pagina: record.pagina,
        }),
      });
      if (!res.ok) throw new Error("No se pudo guardar el lead");
      return { remoto: true };
    }
    // Modo prueba: sin base de datos configurada, se guarda solo en este navegador.
    try {
      const k = "vt_leads";
      const all = JSON.parse(localStorage.getItem(k) || "[]");
      all.push(record);
      localStorage.setItem(k, JSON.stringify(all));
    } catch (e) { /* almacenamiento no disponible */ }
    console.warn("[Visualtech] Lead guardado solo en este navegador. Configurá Supabase en js/config.js.", record);
    return { remoto: false };
  }

  const validEmail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
  function validate(form, required) {
    let msg = "";
    $$(".field.is-invalid", form).forEach((f) => f.classList.remove("is-invalid"));
    required.forEach((name) => {
      const el = form.elements[name];
      const bad = !el.value.trim() || (el.type === "email" && !validEmail(el.value.trim()));
      if (bad) { el.closest(".field").classList.add("is-invalid"); msg = msg || (el.type === "email" && el.value ? "Revisá el formato del email." : "Completá los campos obligatorios."); }
    });
    $(".form-error", form).textContent = msg;
    if (msg) $(".is-invalid input, .is-invalid textarea", form)?.focus();
    return !msg;
  }
  const setLoading = (form, v) => { const b = $('button[type="submit"]', form); b.disabled = v; b.classList.toggle("is-loading", v); };

  /* ---------- Modal de catálogo ---------- */
  function initCatalogModal() {
    const modal = $("#modal-catalogo");
    const form = $("#form-catalogo");
    let lastFocus = null;
    const open = () => {
      lastFocus = document.activeElement;
      modal.classList.add("is-open");
      modal.setAttribute("aria-hidden", "false");
      document.body.classList.add("modal-open");
      setTimeout(() => $("input:not(.hp), a[data-download]", modal.querySelector(".modal-step:not([hidden])"))?.focus(), 60);
    };
    const close = () => {
      modal.classList.remove("is-open");
      modal.setAttribute("aria-hidden", "true");
      document.body.classList.remove("modal-open");
      lastFocus?.focus?.();
    };
    document.addEventListener("click", (e) => { if (e.target.closest("[data-open-catalogo]")) { e.preventDefault(); open(); } });
    $$("[data-close-modal]", modal).forEach((b) => b.addEventListener("click", close));
    modal.addEventListener("keydown", (e) => {
      if (e.key === "Escape") close();
      if (e.key === "Tab") { // focus trap
        const f = $$("a[href], button:not([disabled]), input:not(.hp)", modal).filter((x) => x.offsetParent);
        if (!f.length) return;
        if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f.at(-1).focus(); }
        else if (!e.shiftKey && document.activeElement === f.at(-1)) { e.preventDefault(); f[0].focus(); }
      }
    });
    const showOk = () => {
      $('[data-step="form"]', modal).hidden = true;
      $('[data-step="ok"]', modal).hidden = false;
      $("a[data-download]", modal).focus();
    };
    try { if (localStorage.getItem("vt_catalogo_ok")) showOk(); } catch (e) {}
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (form.elements.web.value) return; // anti-spam
      if (!validate(form, ["nombre", "email", "telefono"])) return;
      setLoading(form, true);
      const fd = new FormData(form);
      try {
        await saveLead({ origen: "catalogo", nombre: fd.get("nombre").trim(), empresa: fd.get("empresa").trim(), email: fd.get("email").trim(), telefono: fd.get("telefono").trim() });
        try { localStorage.setItem("vt_catalogo_ok", "1"); } catch (e) {}
        showOk();
        if (window.gtag) gtag("event", "generate_lead", { form: "catalogo" });
      } catch (err) {
        $(".form-error", form).textContent = "No pudimos registrar tus datos. Probá de nuevo o escribinos por WhatsApp.";
      } finally { setLoading(form, false); }
    });
  }

  /* ---------- Selector múltiple de productos ---------- */
  function initMulti() {
    $$("[data-multi]").forEach((d) => {
      const txt = $("[data-multi-text]", d), def = txt.textContent;
      const sync = () => {
        const sel = $$("input:checked", d).map((i) => i.value);
        txt.textContent = !sel.length ? def : sel.length <= 2 ? sel.join(", ") : `${sel.length} productos seleccionados`;
        d.classList.toggle("has-value", sel.length > 0);
      };
      d.addEventListener("change", sync);
      d.closest("form")?.addEventListener("reset", () => setTimeout(sync));
      document.addEventListener("click", (e) => { if (!d.contains(e.target)) d.open = false; });
      d.addEventListener("keydown", (e) => { if (e.key === "Escape" && d.open) { e.stopPropagation(); d.open = false; $("summary", d).focus(); } });
    });
  }

  /* ---------- Formulario de contacto ---------- */
  function initContactForm() {
    const form = $("#form-contacto");
    if (!form) return;
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (form.elements.web.value) return;
      if (!validate(form, ["nombre", "email", "mensaje"])) return;
      setLoading(form, true);
      const fd = new FormData(form);
      const lead = {
        origen: "contacto", nombre: fd.get("nombre").trim(), empresa: fd.get("empresa").trim(),
        email: fd.get("email").trim(), telefono: fd.get("telefono").trim(),
        productos: fd.getAll("productos"), mensaje: fd.get("mensaje").trim(),
      };
      const ok = $(".form-ok", form);
      try {
        const r = await saveLead(lead);
        if (!r.remoto) {
          // Sin base de datos: se abre el email con la consulta armada.
          const body = `Nombre: ${lead.nombre}\nEmpresa: ${lead.empresa}\nEmail: ${lead.email}\nTeléfono: ${lead.telefono}\nProductos: ${lead.productos.join(", ")}\n\n${lead.mensaje}`;
          location.href = `mailto:${S.contacto.email}?subject=${encodeURIComponent("Consulta desde la web — " + lead.nombre)}&body=${encodeURIComponent(body)}`;
        }
        form.reset();
        ok.hidden = false;
        ok.textContent = `¡Gracias, ${lead.nombre.split(" ")[0]}! Recibimos tu consulta y te respondemos a la brevedad.`;
        if (window.gtag) gtag("event", "generate_lead", { form: "contacto" });
      } catch (err) {
        $(".form-error", form).textContent = "No pudimos enviar tu consulta. Probá de nuevo o escribinos por WhatsApp.";
      } finally { setLoading(form, false); }
    });
  }

  /* ---------- Inicio ---------- */
  const homeTitle = document.title;
  // Arma la página actual y activa sus animaciones. Se vuelve a llamar en cada cambio de página.
  function renderPage() {
    watchers.length = 0;
    document.title = homeTitle;
    mountPage();
    sizeEyebrowLines();
    initRoute();
    initReveal();
    initCounters();
    initMetrics();
    initSlider();
    initSvc();
    initFaq();
    initMulti();
    initContactForm();
    // Página interna → arriba de todo (Tecnología → directo a su grilla); ancla de la home → a esa sección.
    const page = currentRoute().page;
    // Salto directo (sin desplazamiento suave): es una página nueva.
    const jump = (el) => window.scrollTo({ top: el ? el.getBoundingClientRect().top + window.scrollY : 0, behavior: "instant" });
    setTimeout(() => {
      if (page === "tecnologia") jump($("#tecnologia-completa"));
      else if (page !== "home" || location.hash.length < 2) jump(null);
      else { try { jump(document.querySelector(location.hash)); } catch (e) { jump(null); } }
    }, 60);
  }

  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  mountLayout();
  initHeader();
  initCatalogModal();
  renderPage();
  // Cambio de página sin recargar. Las anclas (#contacto, #faq…) desde una página interna llevan a la home en esa sección.
  let currentKey = routeKey();
  window.addEventListener("hashchange", () => {
    if (location.hash === "#app-main") return; // enlace "Saltar al contenido"
    if (routeKey() === currentKey) return;     // ancla dentro de la misma página: el navegador ya hace el scroll
    currentKey = routeKey();
    renderPage();
  });
})();

</script>
